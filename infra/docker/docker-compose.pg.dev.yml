services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "${PG_PORT_LOCAL:-15432}:5432"
    environment:
      POSTGRES_DB: ${PGDATABASE:-ai_ops}
      POSTGRES_USER: ${PGUSER:-ai_ops}
      # Dev-only: passwordless connections for fast local iteration.
      # Do NOT use this in production.
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      # Use a named volume to avoid host permission issues (Postgres runs as a container user).
      - pg_dev_data:/var/lib/postgresql/data

volumes:
  pg_dev_data: {}
