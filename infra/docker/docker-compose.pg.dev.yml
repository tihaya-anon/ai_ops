services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "${PG_PORT_LOCAL:-15432}:5432"
    environment:
      POSTGRES_DB: ${PGDATABASE:-ai_ops}
      POSTGRES_USER: ${PGUSER:-ai_ops}
      # Dev-only: passwordless connections for fast local iteration.
      # Do NOT use this in production.
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      # Use a dev-specific data dir so switching auth modes doesn't get stuck
      # with a previously initialized cluster configuration.
      - ../../data/pg_dev:/var/lib/postgresql/data
