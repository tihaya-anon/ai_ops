services:
  postgres:
    image: postgres:16-alpine
    # Production reference only.
    # Prefer provisioning Postgres separately and injecting connection details
    # via K8s Secrets/ConfigMaps or a cloud Secret manager.
    environment:
      POSTGRES_DB: ${PGDATABASE:-ai_ops}
      POSTGRES_USER: ${PGUSER:-ai_ops}
      POSTGRES_PASSWORD: ${PGPASSWORD:?set PGPASSWORD (or use a Secret manager)}
    volumes:
      - pg_prod_data:/var/lib/postgresql/data

volumes:
  pg_prod_data: {}
