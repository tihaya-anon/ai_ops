services:
  redpanda:
    image: redpandadata/redpanda:v24.1.13
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - "1"
      - --memory
      - 1G
      - --reserve-memory
      - 0M
      - --node-id
      - "0"
      - --check=false
      - --kafka-addr
      - PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr
      - PLAINTEXT://redpanda:9092,PLAINTEXT_HOST://localhost:${REDPANDA_KAFKA_PORT:-19092}
      - --pandaproxy-addr
      - PLAINTEXT://0.0.0.0:8082
      - --advertise-pandaproxy-addr
      - PLAINTEXT://redpanda:8082,PLAINTEXT_HOST://localhost:${REDPANDA_PROXY_PORT:-18082}
    ports:
      - "${REDPANDA_KAFKA_PORT:-19092}:9092"
      - "${REDPANDA_PROXY_PORT:-18082}:8082"
      - "${REDPANDA_ADMIN_PORT:-9644}:9644"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  mock-api:
    build:
      context: ../..
      dockerfile: infra/docker/mock_api/Dockerfile
    ports:
      - "${MOCK_API_PORT:-8000}:8000"
    environment:
      - PYTHONUNBUFFERED=1

  ingest-news:
    build:
      context: ../..
      dockerfile: infra/docker/ingest/Dockerfile
    profiles: ["ingest"]
    depends_on:
      redpanda:
        condition: service_healthy
      mock-api:
        condition: service_started
    environment:
      - KAFKA_BOOTSTRAP=redpanda:9092
      - TOPIC=news_events_raw_v1
      - API_BASE_URL=http://mock-api:8000
      - SOURCE_SYSTEM=ingest_news_api
      - PYTHONUNBUFFERED=1
