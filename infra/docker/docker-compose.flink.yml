services:
  flink-jobmanager:
    image: flink:1.19.1-scala_2.12-java11
    command: jobmanager
    ports:
      - "${FLINK_UI_PORT:-18081}:8081"
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        parallelism.default: 1
      PG_ENABLED: ${PG_ENABLED:-false}
      # Dev convention: always connect to the compose Postgres service.
      # Avoid reading PG_JDBC_URL from env to prevent accidental host.docker.internal usage.
      PG_JDBC_URL: jdbc:postgresql://postgres:5432/${PGDATABASE:-ai_ops}
      PG_USER: ${PGUSER:-ai_ops}
      PG_PASSWORD: ${PGPASSWORD:-}
      PG_TABLE: ${PG_TABLE:-event_candidates_v1}
      PG_BATCH_SIZE: ${PG_BATCH_SIZE:-50}
    volumes:
      - ../..:/workspace
      - ../../streaming/flink/jobs/news_normalize_job/target:/opt/flink/usrlib

  flink-taskmanager:
    image: flink:1.19.1-scala_2.12-java11
    command: taskmanager
    depends_on:
      - flink-jobmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 2
        parallelism.default: 1
      PG_ENABLED: ${PG_ENABLED:-false}
      PG_JDBC_URL: jdbc:postgresql://postgres:5432/${PGDATABASE:-ai_ops}
      PG_USER: ${PGUSER:-ai_ops}
      PG_PASSWORD: ${PGPASSWORD:-}
      PG_TABLE: ${PG_TABLE:-event_candidates_v1}
      PG_BATCH_SIZE: ${PG_BATCH_SIZE:-50}
