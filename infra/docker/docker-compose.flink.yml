services:
  flink-jobmanager:
    image: flink:1.19.1-scala_2.12-java11
    command: jobmanager
    ports:
      - "${FLINK_UI_PORT:-18081}:8081"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        parallelism.default: 1
      PG_ENABLED: ${PG_ENABLED:-false}
      PG_JDBC_URL: ${PG_JDBC_URL:-}
      PG_USER: ${PG_USER:-}
      PG_PASSWORD: ${PG_PASSWORD:-}
      PG_TABLE: ${PG_TABLE:-event_candidates_v1}
      PG_BATCH_SIZE: ${PG_BATCH_SIZE:-50}
    volumes:
      - ../..:/workspace
      - ../../streaming/flink/jobs/news_normalize_job/target:/opt/flink/usrlib

  flink-taskmanager:
    image: flink:1.19.1-scala_2.12-java11
    command: taskmanager
    depends_on:
      - flink-jobmanager
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 2
        parallelism.default: 1
      PG_ENABLED: ${PG_ENABLED:-false}
      PG_JDBC_URL: ${PG_JDBC_URL:-}
      PG_USER: ${PG_USER:-}
      PG_PASSWORD: ${PG_PASSWORD:-}
      PG_TABLE: ${PG_TABLE:-event_candidates_v1}
      PG_BATCH_SIZE: ${PG_BATCH_SIZE:-50}
